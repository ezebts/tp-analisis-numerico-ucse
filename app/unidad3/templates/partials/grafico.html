{% if grafico %}
<div
  data-ajuste
  data-puntos-x="{{ grafico.puntos_x | tojson }}"
  data-puntos-y="{{ grafico.puntos_y | tojson }}"
  data-xs="{{ grafico.xs | tojson }}"
  data-ys="{{ grafico.ys | tojson }}"
>
  <canvas aria-label="Gráfico del ajuste"></canvas>
</div>
{% else %}
<p class="text-sm text-slate-500">El gráfico aparecerá al calcular.</p>
{% endif %}
