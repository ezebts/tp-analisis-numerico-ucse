<div id="puntos" class="space-y-3" {% if swap_puntos %}hx-swap-oob="outerHTML"{% endif %}>
  <div class="max-h-80 overflow-y-auto">
    <table class="w-full">
      <thead>
        <tr>
          <th class="px-1 pb-1 text-left text-xs font-medium text-slate-500">Punto</th>
          <th class="px-1 pb-1 text-left text-xs font-medium text-slate-500">X</th>
          <th class="px-1 pb-1 text-left text-xs font-medium text-slate-500">Y</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for x in xs %}
        <tr>
          <td class="px-1 py-1 text-sm font-medium text-slate-700">P{{ loop.index }}</td>
          <td class="p-1">
            <input
              name="xs"
              value="{{ x | format_decimal }}"
              required
              class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-900 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
            />
          </td>
          <td class="p-1">
            <input
              name="ys"
              value="{{ ys[loop.index0] | format_decimal }}"
              required
              class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-900 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
            />
          </td>
          <td class="p-1 text-right">
            {% if xs|length > puntos_min %}
            <button
              type="button"
              class="rounded-md border border-slate-300 px-2.5 py-2 text-sm text-slate-500 hover:border-red-300 hover:text-red-600"
              aria-label="Quitar P{{ loop.index }}"
              hx-post="{{ url_for('unidad3_quitar_punto') }}"
              hx-include="#formulario"
              hx-vals='{"indice": {{ loop.index0 }}}'
              hx-swap="none"
            >
              ×
            </button>
            {% endif %}
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  <button
    type="button"
    class="w-full rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-900 hover:border-blue-700 hover:text-blue-700 disabled:cursor-not-allowed disabled:opacity-60"
    {% if xs|length >= puntos_max %}disabled{% endif %}
    hx-post="{{ url_for('unidad3_agregar_punto') }}"
    hx-include="#formulario"
    hx-swap="none"
  >
    Agregar punto
  </button>
</div>
